# 매일 1회 경기 분석 데이터 수집 (ADR 0007): API-Football 무료 플랜(하루 100회)에서 라인업·팀 스탯·선수 스탯을 '아직 없는 것'부터 채운다.
# 2024 시즌 → 현재 시즌(어제·오늘) → 2023 → 2022 순서로 약 38일이면 3시즌이 찬다.
name: analysis-batch

on:
  schedule:
    # 한국 시간 09:30 = UTC 00:30. 유럽 저녁 경기가 끝난 뒤라 '어제·오늘' 조회에 결과가 들어 있다.
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 90회 × 7초 ≈ 11분. 넉넉히.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # 테이블 구조를 최신 마이그레이션에 맞춘다 (ADR 0011). 이미 최신이면 아무것도 안 한다.
      - name: DB 마이그레이션 적용
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic upgrade head

      # 하루 100회 중 90회만 쓴다 — 손으로 확인할 여유 10회를 남기기 위해.
      - name: 라인업·스탯 수집 (최대 90회 호출)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.analysis_collect 90
