# 하루 2회 뉴스 배치: 20개 구단 기사 수집 → DB 저장 → 24시간 지난 기사 정리 (CLAUDE.md 3번 "GitHub Actions cron").
# 서버 상주 프로세스 없이, GitHub가 빌려주는 컴퓨터에서 몇 분 돌고 끝난다. 비용 0원 (공개 레포는 Actions 무료).
name: news-batch

on:
  schedule:
    # GitHub cron은 UTC 기준. 한국 시간 08:00 = UTC 23:00(전날), 한국 시간 20:00 = UTC 11:00.
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 손으로도 돌릴 수 있다 (확인용)

jobs:
  collect-and-translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 번역 호출이 길어져도 무한정 돌지 않게
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # 테이블 구조를 최신 마이그레이션에 맞춘다 (ADR 0011). 이미 최신이면 아무것도 안 한다.
      - name: DB 마이그레이션 적용
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alembic upgrade head

      # 키는 레포 Settings → Secrets에 있다. 로그에는 ***로 가려진다.
      - name: 기사 수집 → DB 저장
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.collect

      # 가디언 약관: OP Content는 24시간 안에 다시 받거나 지운다 (ADR 0006). 수집에서 다시 본 기사는 남고, 안 보인 기사는 지운다.
      - name: 24시간 넘게 안 보인 기사 정리
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.cleanup
